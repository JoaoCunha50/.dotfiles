# Toggle mouse support
set -g mouse on

# Toggle status bar
bind b set-option -g status

# Disable auto-renaming of windows
set-option -g allow-rename off

# Leader prefix key
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf

bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind-key f new-window tmux-sessionizer

set -g status-left-length 50
set -g status-left "#S #{?client_prefix,#[fg=colour208]^S,}" # modify the default left status bar, rm `[]`
set -g status-right "Save: #{continuum_status}m | #(~/.local/bin/battery) %d %b %R"

# Lista de plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'nvim ssh python node "~yarn->yarn *" "~npm->npm *" "~npx expo->npx expo *" "~npx ngrok http->npx ngrok http *"'

run '~/.config/tmux/plugins/tpm/tpm'
