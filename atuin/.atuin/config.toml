auto_sync = false
update_check = false
enter_accept = false
keymap_mode = "vim-insert"
bind_up_arrow = false
bind_ctrl_r = true
search_mode = "daemon-fuzzy"
style = "compact"

[daemon]
enabled = true
autostart = true

[threads]
# Atuin 18.24 uses `capture`; 18.25 keeps it as a compatibility alias for `enabled`.
capture = true
capture_tools = true

[keymap.vim-insert]
"tab" = "accept"

[keymap.vim-normal]
"tab" = "accept"

[stats]
common_prefix = ["sudo"]
